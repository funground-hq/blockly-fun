<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>blockly-fun: the phone layout</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #blocks { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <!-- The phone layout (BF-15) as a host page gets it: the built bundle (npm run build), the layout chosen from the
       screen's size as BF-D-049 says, and switched again when the window changes size. tools/phone_check.mjs drives it. -->
  <div id="blocks"></div>
  <script type="module">
    const bf = await import("../dist/blockly-fun.js");
    const element = document.getElementById("blocks");
    // ?catalogue gives the editor funground's catalogue (a copy kept for the tests), as Play does
    const catalogue = new URLSearchParams(location.search).has("catalogue")
      ? await (await fetch("../tests/fixtures/funground/completions.json")).json() : null;
    const wanted = () => (new URLSearchParams(location.search).get("layout")
      ?? (bf.isPhoneScreen(screen.width, screen.height) ? "phone" : "wide"));
    const editor = bf.createBlocksEditor({ element, media: "../dist/media/", layout: wanted(), catalogue });
    window.bfEditor = editor;
    window.bfReady = true;
    // the switch on resize or rotation; resize() measures the page again when the layout stays
    window.addEventListener("resize", () => {
      const next = bf.isPhoneScreen(screen.width, screen.height) ? "phone" : "wide";
      if (!new URLSearchParams(location.search).has("layout") && next !== editor.layout()) editor.layout(next);
    });
  </script>
</body>
</html>
