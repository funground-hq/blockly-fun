<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>blockly-fun: blocks and Python, both ways (phase C)</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { display: flex; gap: 1.5rem; align-items: center; padding: .5rem 1rem; background: #f0f0f0; border-bottom: 1px solid #ccc; }
    header h1 { font-size: 1rem; margin: 0; }
    main { flex: 1; display: grid; grid-template-columns: 1fr 28rem; min-height: 0; }
    #left { position: relative; min-height: 0; }
    #blocks { position: absolute; inset: 0; }
    #stale { position: absolute; inset: 0; z-index: 100; display: none; align-items: flex-start; justify-content: center;
             padding-top: 2rem; background: rgba(255, 255, 255, .7); cursor: pointer; font-size: 1rem; }
    #stale span { background: #fff8d0; border: 1px solid #d9c25a; border-radius: 6px; padding: .6rem 1rem; max-width: 30rem; }
    #stale.error span { background: #ffe3e0; border-color: #d77; }
    #right { display: flex; flex-direction: column; min-height: 0; background: #1e1e1e; color: #e6e6e6; }
    #right label, #note { font-size: .8rem; color: #bbb; padding: .3rem 1rem 0; }
    #python { flex: 3; margin: 0; padding: .6rem 1rem; border: 0; resize: none; background: #1e1e1e; color: #e6e6e6;
              font: 14px/1.4 monospace; tab-size: 4; outline: none; }
    #python:focus { box-shadow: inset 0 0 0 2px #3a7bd5; }
    #stdin { height: 3.2rem; margin: .2rem 1rem; resize: vertical; background: #2a2a2a; color: #e6e6e6; border: 1px solid #444;
             font: 13px/1.3 monospace; }
    #output { flex: 2; margin: 0; padding: .6rem 1rem; overflow: auto; background: #111; font: 13px/1.35 monospace;
              border-top: 1px solid #333; white-space: pre-wrap; }
    #output .stderr { color: #ff8a80; }
    header button { font: inherit; padding: .15rem .8rem; }
  </style>
</head>
<body>
  <header>
    <h1>blockly-fun</h1>
    <label>Words
      <select id="words">
        <option value="scratch">Scratch</option>
        <option value="python">Python</option>
      </select>
    </label>
    <label><input type="checkbox" id="pythonLine" checked> Python line</label>
    <button id="run" disabled title="Run the Python (Ctrl+R)">&#9654; Run</button>
    <button id="stop" disabled>&#9632; Stop</button>
    <span id="pythonStatus"></span>
    <span id="status"></span>
  </header>
  <main>
    <div id="left">
      <div id="blocks"></div>
      <div id="stale" role="button" tabindex="0"><span id="staleText"></span></div>
    </div>
    <div id="right">
      <label for="python">Python: edit it here; the blocks follow when you leave the text (or press Ctrl+Enter)</label>
      <textarea id="python" spellcheck="false" aria-label="The program's Python"></textarea>
      <div id="note" aria-live="polite"></div>
      <label for="stdin">Answers for input(), one per line</label>
      <textarea id="stdin" spellcheck="false"></textarea>
      <pre id="output" aria-label="What the program printed" aria-live="polite"></pre>
    </div>
  </main>
  <canvas id="canvas" width="1" height="1" hidden></canvas>
  <script src="../node_modules/blockly/blockly_compressed.js"></script>
  <script src="../node_modules/blockly/msg/en.js"></script>
  <script type="importmap">{"imports": {"blockly": "./blockly-global.js"}}</script>
  <script type="module" src="./demo.js"></script>
</body>
</html>
